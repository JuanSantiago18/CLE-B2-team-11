<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="spotty/contact-page/contact.css">

    <title>Spotty - Contact</title>
</head>

<body>

<header>
    <nav class="navBar">
        <div class="navLeft">
            <img class="sitelogo" src="spotty/images/sitelogo.png" alt="Spotty Logo">
        </div>

        <div class="navRight">
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
</header>

<main>
    <div>
        <h1 class="main-text">CONTACT</h1>
    </div>

    <div>
        <h2>Form</h2>
    </div>

    <section class="form-container">
        <form>
            <div class="form-field">
                <label for="first-name">Voornaam:</label>
                <input type="text" id="first-name" name="first-name" placeholder="Voornaam"   pattern="[A-Za-z]+" minlength="2" required>
            </div>

            <div class="form-field">
                <label for="last-name">Achternaam:</label>
                <input type="text" id="last-name" name="last-name" placeholder="Achternaam"  pattern="[A-Za-z]+" minlength="2" required>
            </div>

            <div class="form-field email-adres">
                <label for="email">Email-adres:</label>
                <input type="email" id="email" name="email" placeholder="Someone@hr.nl" required>
            </div>

            <div class="form-field">
                <label for="phone-number">Telefoonnummer:</label>
                <input type="text" id="phone-number" name="phone-number" placeholder="Telefoonnummer" minlength="10" required>
            </div>

            <div class="form-field">
                <label for="City">Woonplaats:</label>
                <input type="text" id="City" name="City" placeholder="Woonplaats"   pattern="[A-Za-z]+" minlength="3" required>
            </div>

            <div class="form-field">
                <label for="street">Straat:</label>
                <input type="text" id="street" name="street" placeholder="Straat"  pattern="[A-Za-z]+" minlength="3" required>
            </div>

            <div class="form-field">
                <label for="house-number">Huisnummer:</label>
                <input type="text" id="house-number" name="house-number" placeholder="Huisnummer" minlength="3" required>
            </div>

            <div class="form-field">
                <label for="birth-date">Geboortedatum:</label>
                <input type="date" id="birth-date" name="birth-date" placeholder="Geboortedatum">
            </div>

            <div class="form-field">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender">
                    <option value="" disabled selected>Gender</option>
                    <option value="man">Man</option>
                    <option value="woman">Vrouw</option>
                    <option value="other">Anders</option>
                </select>
            </div>

            <div class="form-field">
                <label for="subject">Onderwerp:</label>
                <select id="subject" name="subject">
                    <option value="" disabled selected>Kies onderwerp van het bericht..</option>
                    <option value="question">Vraag</option>
                    <option value="problem">Probleem</option>
                    <option value="help">Hulp</option>
                    <option value="other">Anders</option>
                </select>
            </div>

            <div class="form-field">
                <label for="message">Bericht:</label>
                <textarea id="message" name="message" placeholder="Uw bericht hier..." required></textarea>
            </div>

            <div class="form-field">
                <label for="agree">Ik ga akkoord met de algemene voorwaarden</label>
                <input type="checkbox" id="agree" name="agree" required>
            </div>

            <div class="form-field">
                <button type="submit" id="send-to" name="send-to">Versturen</button>
            </div>
        </form>
    </section>
</main>

<footer></footer>

</body>
</html>
